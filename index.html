<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador mBot 2</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header id="topbar">
    <h1 data-i18n="APP_TITLE">Simulador mBot 2</h1>
    <div id="controls">
      <button id="btn-run" data-i18n="RUN" data-icon="▶">▶ Executar</button>
      <button id="btn-stop" data-i18n="STOP" data-icon="■">■ Parar</button>
      <button id="btn-reset" data-i18n="RESET" data-icon="↻">↻ Reiniciar</button>
      <button id="btn-center" data-i18n="CENTER" data-icon="🔍">🔍 Centrar</button>
      <button id="btn-save" data-i18n="SAVE">Guardar</button>
      <button id="btn-load" data-i18n="LOAD">Carregar</button>
      <button id="btn-new" data-i18n="NEW">Novo</button>
      <input type="file" id="file-input-load" accept=".xml" style="display:none" />
      <label for="map-select" id="map-select-label" data-i18n="MAP_LABEL">Mapa:</label>
      <select id="map-select" title="Selecionar mapa" data-i18n-title="MAP_SELECT" data-i18n-label="MAP_SELECT"></select>
      <select id="toolbox-mode" aria-label="Nível da caixa de ferramentas" data-i18n-label="TOOLBOX_MODE">
        <option value="beginner" data-i18n="BEGINNER">Principiante</option>
        <option value="expert" data-i18n="EXPERT">Avançado</option>
      </select>
      <label for="language-select" data-i18n="LANGUAGE">Idioma</label>
      <select id="language-select" aria-label="Idioma" data-i18n-label="LANGUAGE"></select>
    </div>
  </header>
  <main>
    <div id="blockly-area"></div>
    <div id="sim-area">
      <div id="canvas-wrapper">
        <canvas id="sim-canvas" width="1600" height="980"></canvas>
      </div>
      <div class="screen-console-row">
        <canvas id="display-canvas" width="256" height="256"></canvas>
        <div id="console-panel"></div>
      </div>
      <div id="button-row-wrapper">
        <span class="button-row-label" data-i18n="CONTROLLER">Controlador:</span>
        <div id="button-row"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
