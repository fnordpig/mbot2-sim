<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mBot 2 Simulator</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header id="topbar">
    <h1 data-i18n="APP_TITLE">mBot 2 Simulator</h1>
    <div id="controls">
      <button id="btn-run" data-i18n="RUN" data-icon="▶">▶ Run</button>
      <button id="btn-stop" data-i18n="STOP" data-icon="■">■ Stop</button>
      <button id="btn-reset" data-i18n="RESET" data-icon="↻">↻ Reset</button>
      <button id="btn-center" data-i18n="CENTER" data-icon="🔍">🔍 Centre</button>
      <button id="btn-save" data-i18n="SAVE">Save</button>
      <button id="btn-load" data-i18n="LOAD">Load</button>
      <button id="btn-new" data-i18n="NEW">New</button>
      <input type="file" id="file-input-load" accept=".xml" style="display:none" />
      <button id="btn-settings" data-i18n="SETTINGS" aria-haspopup="dialog" aria-controls="settings-dialog">Settings</button>
    </div>
  </header>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title" data-i18n="SETTINGS">Settings</h2>
      <button id="btn-settings-close" data-i18n="SETTINGS_CLOSE" autofocus>Close</button>
    </div>
    <div class="settings-field">
      <label for="map-select" id="map-select-label" data-i18n="MAP_LABEL">Map:</label>
      <select id="map-select" title="Select map" data-i18n-title="MAP_SELECT" data-i18n-label="MAP_SELECT"></select>
    </div>
    <div class="settings-field">
      <label for="language-select" data-i18n="LANGUAGE">Language</label>
      <select id="language-select" aria-label="Language" data-i18n-label="LANGUAGE"></select>
    </div>
    <label class="settings-toggle">
      <input type="checkbox" id="toolbox-mode" />
      <span data-i18n="SETTINGS_EXPERT">Expert toolbox</span>
    </label>
    <label class="settings-toggle">
      <input type="checkbox" id="end-on-collision" aria-describedby="settings-collision-help" checked />
      <span data-i18n="SETTINGS_END_COLLISION">End on collision</span>
    </label>
    <p id="settings-collision-help" data-i18n="SETTINGS_COLLISION_HELP">Turn off to slide along walls and continue running.</p>
    <p id="settings-running-hint" data-i18n="SETTINGS_RUNNING_HINT" hidden>Stop the program to change settings.</p>
  </dialog>
  <main>
    <div id="blockly-area"></div>
    <div id="sim-area">
      <div id="canvas-wrapper">
        <canvas id="sim-canvas" width="1600" height="980"></canvas>
      </div>
      <div class="screen-console-row">
        <canvas id="display-canvas" width="256" height="256"></canvas>
        <div id="console-panel"></div>
      </div>
      <div id="button-row-wrapper">
        <span class="button-row-label" data-i18n="CONTROLLER">Controller:</span>
        <div id="button-row"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
